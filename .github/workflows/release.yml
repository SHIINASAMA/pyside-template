on:
  push:
    tags:
      # GitHub Actions does not support full regular expressions for tag matching.
      # Please set tag rules in the repository settings:
      # Settings -> Tags -> Go to rulesets to create a new tag rule
      # The pattern must be: ([0-9]+(\.[0-9]+){1,3})(-(stable|alpha|beta|nightly|dev))?$
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: App

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          if [[ ! "$TAG" =~ ^([0-9]+(\.[0-9]+){1,3})(-(stable|alpha|beta|nightly|dev))?$ ]]; then
            echo "❌ Tag does not match version pattern!"
            exit 1
          fi
          echo "✅ Tag format OK"

  test:
    uses: ./.github/workflows/test.yml

  build:
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          #   arch: x64
          #   name: linux
          # - os: windows-latest
          #   arch: x64
          #   name: windows
          - os: macos-latest
            arch: arm64
            name: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs:
      - check-version
      - test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: yezz123/setup-uv@v4

      - name: Before script (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Setup, install dependencies, build
        if: runner.os != 'macOS'
        run: |
          uv sync
          uv run pyside-cli build --onedir

      - name: Setup, install dependencies, build (macOS)
        if: runner.os == 'macOS'
        run: |
          uv sync --extra macos-sparkle
          uv run pyside-cli build

      - name: Embed Sparkle.framework (macOS)
        if: runner.os == 'macOS'
        env:
          SPARKLE_APPCAST_URL: ${{ secrets.SPARKLE_APPCAST_URL }}
          SPARKLE_EDDSA_PUBLIC_KEY: ${{ secrets.SPARKLE_EDDSA_PUBLIC_KEY }}
        run: |
          uv run python scripts/embed_sparkle.py \
            --app-bundle-path build/${{ env.APP_NAME }}.app \
            --sparkle-version 2.9.6 \
            --appcast-url "$SPARKLE_APPCAST_URL" \
            --eddsa-public-key "$SPARKLE_EDDSA_PUBLIC_KEY"

      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Import certificate if provided, otherwise ad-hoc sign
          if [ -n "$APPLE_CERTIFICATE_P12_BASE64" ]; then
            echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/cert.p12
            security create-keychain -p actions build.keychain || true
            security default-keychain -s build.keychain
            security unlock-keychain -p actions build.keychain
            security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
            IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -oE '".*"' | head -n1 | tr -d '"')
            echo "Using identity: $IDENTITY"
            # Export for later steps (dmg signing) so they don't re-resolve an empty identity.
            echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            uv run python scripts/codesign_macos.py --app-bundle build/${{ env.APP_NAME }}.app --identity "$IDENTITY" --entitlements scripts/entitlements.plist --verbose
          else
            echo "⚠️  No certificate secret — ad-hoc signing for local Sparkle E2E (Gatekeeper will still reject)"
            uv run python scripts/codesign_macos.py --app-bundle build/${{ env.APP_NAME }}.app --verbose
          fi

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          brew install create-dmg
          xattr -cr build/${{ env.APP_NAME }}.app
          ./build-dmg.sh
          # Sign the DMG itself (wifi-lens: codesign --sign --timestamp --options=runtime)
          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options=runtime "release/${{ env.APP_NAME }}Installer.dmg"
          else
            echo "⚠️  SIGNING_IDENTITY not set — dmg not independently signed"
          fi
          mkdir -p release
          cd build
          zip -r \
            ../release/${{ env.APP_NAME }}-${{ matrix.name }}-${{ matrix.arch }}-${{ github.ref_name }}.zip \
            ${{ env.APP_NAME }}.app/
          cd ../release
          shopt -s nullglob
          for f in *.zip *.tar.gz *.dmg; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Notarize the DMG (matching wifi-lens), not a temp zip
          if [ -n "$APPLE_ID" ] || [ -n "$APPLE_API_KEY" ]; then
            uv run python scripts/notarize_macos.py --dmg release/${{ env.APP_NAME }}Installer.dmg --wait
          else
            echo "⚠️  Notarization credentials not set — skipping (add APPLE_ID / APPLE_API_KEY to enable)"
          fi

      - name: Generate Signed Appcast (macOS)
        if: runner.os == 'macOS'
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Sparkle generates a signed appcast.xml from the macOS .app update (dmg)
          mkdir -p release/appcast-src
          # Prefer the dmg in release/; fall back to a zip containing a .app if present
          cp release/${{ env.APP_NAME }}Installer.dmg release/appcast-src/ 2>/dev/null || cp build/${{ env.APP_NAME }}Installer.dmg release/appcast-src/ 2>/dev/null || true
          # Only generate when the private-key secret is set; otherwise skip (dev can run generate_appcast.sh manually)
          if [ -n "$SPARKLE_ED25519_PRIVATE_KEY" ]; then
            SPARKLE_APPCAST_BASE_URL="https://github.com/${{ github.repository }}/releases/download" \
            SPARKLE_PRIVATE_KEY="$SPARKLE_ED25519_PRIVATE_KEY" \
              bash scripts/generate_appcast.sh release/appcast-src "${{ env.APP_NAME }}" "${{ github.ref_name }}" "$RELEASE_TAG"
            cp release/appcast-src/appcast.xml release/ 2>/dev/null || true
            echo "appcast.xml generated and added to release dir"
          else
            echo "SPARKLE_ED25519_PRIVATE_KEY not set; skipping appcast generation (run generate_appcast.sh manually for local dev)"
          fi

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mv ./build/${{ env.APP_NAME }} ./build/${{ env.APP_NAME }}-${{ matrix.name }}-${{ matrix.arch }}
          mkdir -p release
          cd build
          zip -r \
            ../release/${{ env.APP_NAME }}-${{ matrix.name }}-${{ matrix.arch }}-${{ github.ref_name }}.zip \
            ${{ env.APP_NAME }}-${{ matrix.name }}-${{ matrix.arch }}/
          cd ../release
          shopt -s nullglob
          for f in *.zip *.tar.gz *.dmg; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item -Path ./build/${{ env.APP_NAME }} -Destination ./build/${{ env.APP_NAME }}-${{ matrix.name }}-${{ matrix.arch }}
          New-Item -ItemType Directory -Path release
          Compress-Archive -Path ./build/${{ env.APP_NAME }}-${{ matrix.name }}-${{ matrix.arch }} `
            -DestinationPath ./release/${{ env.APP_NAME }}-${{ matrix.name }}-${{ matrix.arch }}-${{ github.ref_name }}.zip
          cd release
          Get-ChildItem -Path . -Include *.zip,*.tar.gz,*.dmg | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() + "  " + $_.Name | Out-File -Encoding ascii ($_.FullName + ".sha256")
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            ./release/*

  build_whl:
    runs-on: ubuntu-latest
    needs:
      - check-version
      - test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: yezz123/setup-uv@v4

      - name: Setup, install dependencies, build
        run: |
          uv sync
          uv run pyside-cli build --stage rc
          uv build --no-sources

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Python wheel package
          path: ./dist/*.whl

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - build_whl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ./release/*
          name: Release ${{ github.ref_name }}
          body_path: CHANGE.md
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-dev') || contains(github.ref_name, '-nightly') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
